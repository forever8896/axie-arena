<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A game, not a document: no pinch-zoom, and draw under the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ronkacy — One Ronke, One Field</title>
    <meta name="description" content="A browser arena brawler in the Ronkeverse. Drop into a flooded terrace, take bounties off whoever is carrying them, and walk out through a Moon Gate before anyone catches you." />
    <meta name="theme-color" content="#101936" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ronkacy" />
    <meta property="og:description" content="Drop in, take bounties, walk out with them. Ronke brings up rice, Ronka spits a heart, Horske runs you down." />
    <meta property="og:image" content="/brand/ronke-mark.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Ronke himself, cropped from the collection art. The moon mark stays
         in the game, where it crowns every Moon Gate. -->
    <link rel="icon" type="image/png" href="/brand/ronke-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      /* viewport-fit=cover draws under the notch and the home indicator, so
         the game needs to know how much of its own edges it cannot trust. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html, body {
        margin: 0; height: 100%; background: #101936;
        overflow: hidden; overscroll-behavior: none;
      }
      /*
       * Fixed to the viewport rather than sized in vh.
       *
       * On a phone 100vh is the viewport with the address bar HIDDEN, so a
       * canvas that tall hangs below the fold and takes the thumb buttons with
       * it. dvh tracks the bar as it comes and goes, and position:fixed pins
       * the whole thing to what is actually on screen.
       */
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
      }
      canvas { display: block; }

      #game, #game canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
    
      /* A twin-stick brawler wants two thumbs and a wide field. Portrait is
         not a layout worth fighting for, so ask for the turn instead. */
      #rotate-note { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-note {
          display: flex;
          position: fixed; inset: 0; z-index: 50;
          align-items: center; justify-content: center; text-align: center;
          background: #101936; color: #f2f7e4;
          font-family: ui-monospace, monospace; font-size: 15px;
          padding: 2rem; line-height: 1.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-note">TURN YOUR PHONE SIDEWAYS<br />Ronkacy is played with two thumbs.</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
